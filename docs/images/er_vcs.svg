<text x="86" y="1055" font-size="12.5" fill="#333">1 / N / M = cardinality</text>
<text x="30" y="88" font-size="12.5" fill="#555">PARENT_OF is a recursive relationship on COMMIT (a merge commit has 2 parents). CHANGE_LOG is a stand-alone audit entity.</text>
<text x="30" y="106" font-size="12.5" fill="#555">ANCHOR and VERIFICATION_RUN cannot exist without their COMMIT (weak entities, identifying relationships).</text>
